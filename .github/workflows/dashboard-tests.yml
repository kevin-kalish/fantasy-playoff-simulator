name: Dashboard regression tests
on:
  pull_request:
  push:
    branches: [dashboard-contract-v1]
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:dashboard
      - run: npm test
      - name: Benchmark synthetic 10-team schedule impact
        run: npm run benchmark:schedule -- 100

      - name: Benchmark synthetic GM targeted replication
        run: npm run benchmark:gm -- 100 3
      - name: Benchmark GM targeted replication at higher simulation count
        run: npm run benchmark:gm -- 1000 3
